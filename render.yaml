services:
  - type: web
    name: gold-alert-bot
    env: python
    plan: free
    buildCommand: pip install -r vwap_bot/requirements.txt
    startCommand: python vwap_bot/main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CAPITAL_API_KEY
        sync: false
      - key: CAPITAL_IDENTIFIER
        sync: false
      - key: CAPITAL_PASSWORD
        sync: false
      - key: CAPITAL_DEMO
        value: "false"
      - key: BOT_MODE
        value: alert_only
