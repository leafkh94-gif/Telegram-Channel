name: Trading Alert Bot

# Reliable 24/7 coverage on a PUBLIC repo (unlimited free Actions minutes).
#
# How it works:
#   * Each run executes sweep_alert_agent.py for ~5h40m then exits cleanly.
#   * At the end of each run a "self-chain" step triggers the next run via
#     the GitHub API — guaranteed handoff with no gap, no cron scheduler needed.
#   * The schedule cron is a recovery-only watchdog: if the chain ever dies for
#     any reason, the next tick (worst-case ~60 min) restarts it automatically.
#   * concurrency group prevents duplicate runners if cron and self-chain overlap.

on:
  workflow_dispatch:        # manual start / restart from the Actions tab
  schedule:
    # حارس تعافٍ فقط — السلسلة الذاتية (self-chain) هي الآلية الأساسية.
    # كان كل ساعة؛ مع cancel-in-progress: true صار ذلك يعيد تشغيل البوت كل ساعة
    # ويصفّر ذاكرة منع التكرار (dedup) فتتكرّر الإشارات. كل 6 ساعات يكفي للتعافي.
    - cron: '17 */6 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node.js 20 deprecation warnings

permissions:
  actions: write    # required for self-chain workflow_dispatch trigger
  contents: write   # required to push bot_status.json to status branch

concurrency:
  group: trading-bot
  # كان false: التشغيل القديم يبقى ماسكاً المكان حتى 5h40m، فأي كود جديد
  # يُدمج لا يعمل إطلاقاً إلا بإلغاء التشغيل القديم يدوياً (تكرّر 3 مرات:
  # v2 والـ trend fix وإصلاح الدخول كلها بقيت معطّلة بينما القديم يعمل).
  # الآن true: التشغيل الأحدث يلغي القديم ويأخذ مكانه فوراً — أحدث كود يفوز.
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # hard ceiling; agent exits its own loop before this

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r scalping_bot/requirements.txt

      - name: Restore agent state
        uses: actions/cache@v4
        with:
          path: |
            risk_state.json
            signals_log.csv
          key: scalping-state-${{ github.run_id }}
          restore-keys: |
            scalping-state-

      - name: Run alert bot (continuous, ~5h40m then clean handoff)
        run: |
          start=$(date +%s)
          timeout 20400 python scalping_bot/main.py || true
          echo "RUN_ELAPSED=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_API_KEY:      ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER:   ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD:     ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_DEMO:         "false"
          # Safety: deploy stays in alert_only. Real order execution requires
          # explicitly setting BOT_MODE=full_auto (spec: 30 paper setups first).
          BOT_MODE:             alert_only

      - name: Self-chain — queue the next run immediately
        if: always()
        run: |
          # Crash-loop guard: only hand off if the bot actually ran a while. A fast
          # exit means it crashed on startup — re-dispatching would flood. The hourly
          # `schedule` cron still recovers the bot automatically once the cause is fixed.
          if [ "${RUN_ELAPSED:-0}" -lt 300 ]; then
            echo "Bot exited after ${RUN_ELAPSED:-0}s (<300s) — NOT self-chaining (crash-loop guard)."
            exit 0
          fi
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/alert_bot.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Next run queued."
